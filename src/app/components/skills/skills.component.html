<div class="w-full min-h-[75vh] flex flex-col items-center justify-start py-10 overflow-hidden">
  
  <div class="text-center mb-16" data-aos="fade-down" data-aos-duration="800">
    <h3 class="text-[#20c997] font-semibold tracking-[0.2em] text-sm mb-4 uppercase">
      My Expertise
    </h3>
    <h2 class="text-4xl md:text-5xl font-bold text-slate-900 dark:text-white font-serif drop-shadow-md">
      Skills & Technologies
    </h2>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 w-full max-w-6xl">
    
    <div *ngFor="let skill of skills; let i = index" 
         [attr.data-aos]="'fade-up'" 
         [attr.data-aos-delay]="i * 100" 
         appTilt
         class="glass-card p-8 rounded-3xl flex flex-col items-center text-center transition-shadow duration-300 hover:shadow-[0_8px_30px_rgb(0,0,0,0.12)] dark:hover:shadow-[0_8px_30px_rgb(255,255,255,0.05)] cursor-pointer">
      
      <div [class]="skill.iconClass + ' w-14 h-14 rounded-xl flex items-center justify-center text-2xl mb-6 shadow-sm'">
        {{ skill.symbol }}
      </div>
      
      <h4 class="text-xl font-bold text-slate-900 dark:text-white mb-3">
        {{ skill.title }}
      </h4>
      
      <p class="text-slate-600 dark:text-gray-400 text-sm leading-relaxed">
        {{ skill.desc }}
      </p>
      
    </div>
    
  </div>
</div>
