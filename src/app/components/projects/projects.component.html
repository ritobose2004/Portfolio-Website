<div class="w-full min-h-[75vh] flex flex-col items-center justify-start py-10 overflow-hidden">
  
  <div class="text-center mb-16" data-aos="fade-down" data-aos-duration="800">
    <h3 class="text-[#20c997] font-semibold tracking-[0.2em] text-sm mb-4 uppercase">
      My Portfolio
    </h3>
    <h2 class="text-4xl md:text-5xl font-bold text-slate-900 dark:text-white font-serif drop-shadow-md">
      Featured Projects
    </h2>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 w-full max-w-6xl">
    
    <div *ngFor="let project of projects; let i = index" 
         [attr.data-aos]="'fade-up'" 
         [attr.data-aos-delay]="i * 150" 
         appTilt
         class="glass-card p-8 rounded-3xl flex flex-col items-start transition-shadow duration-300 hover:shadow-[0_8px_30px_rgb(79,70,229,0.15)] cursor-pointer h-full relative group">
      
      <div class="absolute top-0 right-0 w-32 h-32 bg-[#4F46E5]/10 rounded-bl-full rounded-tr-3xl -z-10 transition-transform group-hover:scale-110"></div>

      <h3 class="text-2xl font-bold text-slate-900 dark:text-white mb-6 pr-8">{{ project.title }}</h3>
      
      <ul class="text-slate-600 dark:text-gray-300 text-sm leading-relaxed mb-8 flex-grow list-disc list-outside ml-5 space-y-3">
        <li *ngFor="let highlight of project.highlights">
          {{ highlight }}
        </li>
      </ul>
      
      <div class="flex flex-wrap gap-2 mb-8">
        <span *ngFor="let tag of project.tags" class="px-3 py-1 text-xs font-semibold rounded-full bg-slate-200 dark:bg-white/10 text-[#4F46E5] dark:text-cyan-300">
          {{ tag }}
        </span>
      </div>

      <div class="flex gap-5 mt-auto w-full pt-5 border-t border-slate-300/50 dark:border-white/10">
        <a [href]="project.github" target="_blank" class="flex items-center gap-2 text-sm font-bold text-slate-700 dark:text-gray-300 hover:text-[#4F46E5] dark:hover:text-white transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
          GitHub
        </a>
      </div>
      
    </div>
    
  </div>
</div>
